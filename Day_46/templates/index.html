<!DOCTYPE html>

<html>

<head>
    <title>ML Predictor</title>
</head>

<body>

    <h1>Machine Learning Predictor</h1>

    <form method="POST">

        <input
            type="number"
            name="value"
            step="any"
            required
        >

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction is not none %}

        <h2>
            Prediction: {{ prediction }}
        </h2>

    {% endif %}

</body>

</html>

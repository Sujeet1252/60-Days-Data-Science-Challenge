<!DOCTYPE html>
<html>

<head>
    <title>Employee Salary Predictor</title>
</head>

<body>

    <h1>Employee Salary Predictor</h1>

    <form method="POST">

        <label>Age:</label>
        <input type="number" name="age" required>

        <br><br>

        <label>Experience:</label>
        <input type="number" name="experience" required>

        <br><br>

        <label>Education:</label>
        <input type="text" name="education"
               placeholder="Bachelor" required>

        <br><br>

        <label>Job Title:</label>
        <input type="text" name="job_title"
               placeholder="Analyst" required>

        <br><br>

        <label>Gender:</label>
        <input type="text" name="gender"
               placeholder="Male" required>

        <br><br>

        <label>Location:</label>
        <input type="text" name="location"
               placeholder="Mumbai" required>

        <br><br>

        <button type="submit">
            Predict Salary
        </button>

    </form>

    {% if prediction is not none %}

        <h2>
            Predicted Salary: ₹{{ "%.2f"|format(prediction) }}
        </h2>

    {% endif %}

</body>

</html>

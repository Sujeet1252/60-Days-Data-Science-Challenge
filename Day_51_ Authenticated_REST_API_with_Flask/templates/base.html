<!DOCTYPE html>
<html>

<head>

    <title>{% block title %}Student Management System{% endblock %}</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            margin: 5px 0;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .logout {
            float: right;
        }

    </style>

</head>

<body>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>

</html>

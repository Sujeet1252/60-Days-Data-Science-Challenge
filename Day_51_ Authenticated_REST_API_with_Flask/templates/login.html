{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="POST" action="/login">

    <label>Username:</label><br>

    <input
        type="text"
        name="username"
        required
    >

    <br><br>

    <label>Password:</label><br>

    <input
        type="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<br>

<p>
    Don't have an account?
    <a href="/register">Register</a>
</p>

{% endblock %}

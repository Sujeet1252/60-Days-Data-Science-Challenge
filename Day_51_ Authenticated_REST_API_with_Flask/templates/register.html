{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<h1>Register</h1>

<form method="POST" action="/register">

    <label>Username:</label><br>

    <input
        type="text"
        name="username"
        required
    >

    <br><br>

    <label>Password:</label><br>

    <input
        type="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<p>
    Already have an account?
    <a href="/login">Login</a>
</p>

{% endblock %}

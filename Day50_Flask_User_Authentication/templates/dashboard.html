{% extends "base.html" %}


{% block title %}

Dashboard

{% endblock %}



{% block content %}


<div class="dashboard-card">


    <h1>
        Welcome, {{ username }}!
    </h1>


    <p class="success-text">
        You are successfully logged in.
    </p>


    <p>
        This is your protected dashboard.
    </p>


    <div class="dashboard-info">


        <div class="info-box">

            <h3>
                Authentication
            </h3>

            <p>
                Successfully authenticated
            </p>

        </div>


        <div class="info-box">

            <h3>
                Session
            </h3>

            <p>
                Active
            </p>

        </div>


        <div class="info-box">

            <h3>
                Database
            </h3>

            <p>
                SQLite
            </p>

        </div>


    </div>


    <a
        class="button"
        href="{{ url_for('logout') }}"
    >
        Logout
    </a>


</div>


{% endblock %}

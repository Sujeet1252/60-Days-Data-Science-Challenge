{% extends "base.html" %}


{% block title %}

Register

{% endblock %}



{% block content %}


<div class="form-card">


    <h1>
        Create Account
    </h1>


    <p class="subtitle">
        Register a new user account.
    </p>


    <form
        method="POST"
        action="{{ url_for('register') }}"
    >


        <label for="username">
            Username
        </label>


        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 6 characters"
            required
        >


        <button type="submit">
            Register
        </button>


    </form>


    <p class="form-footer">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>


</div>


{% endblock %}

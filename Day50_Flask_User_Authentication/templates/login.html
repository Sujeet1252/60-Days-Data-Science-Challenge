{% extends "base.html" %}


{% block title %}

Login

{% endblock %}



{% block content %}


<div class="form-card">


    <h1>
        Login
    </h1>


    <p class="subtitle">
        Login to access your dashboard.
    </p>


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >


        <label for="username">
            Username
        </label>


        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <p class="form-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </p>


</div>


{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Approval Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;

            text-align: center;

            background: #e8f5e9;
            color: #166534;

            border-radius: 6px;

            font-weight: bold;
        }

    </style>
</head>


<body>

<div class="container">

    <h1>Loan Approval Prediction</h1>

    <form action="/form" method="POST">

        <label>Number of Dependents</label>

        <input
            type="number"
            name="dependents"
            min="0"
            required
        >


        <label>Education</label>

        <select name="education" required>

            <option value="">Select Education</option>

            <option value="Graduate">
                Graduate
            </option>

            <option value="Not Graduate">
                Not Graduate
            </option>

        </select>


        <label>Self Employed</label>

        <select name="self_employed" required>

            <option value="">Select</option>

            <option value="Yes">
                Yes
            </option>

            <option value="No">
                No
            </option>

        </select>


        <label>Annual Income</label>

        <input
            type="number"
            name="income"
            required
        >


        <label>Loan Amount</label>

        <input
            type="number"
            name="loan_amount"
            required
        >


        <label>Loan Term</label>

        <input
            type="number"
            name="loan_term"
            required
        >


        <label>CIBIL Score</label>

        <input
            type="number"
            name="cibil_score"
            min="300"
            max="900"
            required
        >


        <label>Residential Assets Value</label>

        <input
            type="number"
            name="residential_assets"
            required
        >


        <label>Commercial Assets Value</label>

        <input
            type="number"
            name="commercial_assets"
            required
        >


        <label>Luxury Assets Value</label>

        <input
            type="number"
            name="luxury_assets"
            required
        >


        <label>Bank Assets Value</label>

        <input
            type="number"
            name="bank_assets"
            required
        >


        <button type="submit">
            Submit Application
        </button>

    </form>


    {% if prediction %}

        <div class="result">

            {{ prediction }}

        </div>

    {% endif %}


</div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marks Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .calculate {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="calculate">

        <h1>Calculate Average Marks</h1>

        <!-- Form sends data to Flask -->
        <form action="{{ url_for('form') }}" method="POST">

            <label>Python Marks</label>
            <input type="number" name="python" placeholder="Enter Python marks" required>

            <label>Data Science Marks</label>
            <input type="number" name="data_science" placeholder="Enter Data Science marks" required>

            <label>SQL Marks</label>
            <input type="number" name="sql" placeholder="Enter SQL marks" required>

            <label>Statistics Marks</label>
            <input type="number" name="statistics" placeholder="Enter Statistics marks" required>

            <label>Machine Learning Marks</label>
            <input type="number" name="machine_learning" placeholder="Enter ML marks" required>

            <button type="submit">Calculate Average</button>

        </form>


        {% if average is not none %}

        <div class="result">

            <h2>Your Average Marks: {{ average }}</h2>
            <h2>Your Grade: {{ grade }}</h2>

        </div>

        {% endif %}

    </div>

</body>
</html>
